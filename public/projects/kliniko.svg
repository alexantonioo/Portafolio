    <circle cx="188" cy="186" r="7" fill="#f87171" fill-opacity="0.8"/>
    <circle cx="212" cy="186" r="7" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="236" cy="186" r="7" fill="#34d399" fill-opacity="0.8"/>
    <line x1="150" y1="214" x2="1130" y2="214" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Sidebar -->
    <line x1="392" y1="214" x2="392" y2="730" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="182" y="248" width="44" height="44" rx="12" fill="url(#accent)"/>
    <text x="204" y="279" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#ffffff">K</text>
    <rect x="238" y="260" width="108" height="12" rx="6" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="238" y="280" width="72" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.25"/>
    <g fill="#ffffff">

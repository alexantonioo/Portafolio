    <!-- Main heading -->
    <text x="438" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" letter-spacing="-1">Kliniko</text>
    <text x="440" y="322" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">Gestión para clínicas de fisioterapia</text>


      <rect x="678" y="404" width="64" height="22" rx="6" fill="#ffffff" fill-opacity="0.75"/>
      <rect x="678" y="432" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>

      <rect x="870" y="358" width="198" height="96" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="894" y="382" width="34" height="10" rx="5" fill="#34d399" fill-opacity="0.9"/>

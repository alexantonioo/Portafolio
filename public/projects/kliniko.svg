    <!-- List panel -->
    <rect x="870" y="478" width="198" height="212" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
    <g fill="#ffffff">
      <rect x="894" y="506" width="110" height="10" rx="5" fill-opacity="0.6"/>
      <rect x="894" y="540" width="150" height="30" rx="9" fill-opacity="0.07"/>
      <circle cx="912" cy="555" r="9" fill-opacity="0.35"/>
      <rect x="932" y="550" width="88" height="9" rx="4.5" fill-opacity="0.35"/>
      <rect x="894" y="584" width="150" height="30" rx="9" fill-opacity="0.07"/>
      <circle cx="912" cy="599" r="9" fill-opacity="0.35"/>
      <rect x="932" y="594" width="72" height="9" rx="4.5" fill-opacity="0.35"/>
      <rect x="894" y="628" width="150" height="30" rx="9" fill-opacity="0.07"/>
      <circle cx="912" cy="643" r="9" fill-opacity="0.35"/>
      <rect x="932" y="638" width="94" height="9" rx="4.5" fill-opacity="0.35"/>

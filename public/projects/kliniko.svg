      <rect x="894" y="432" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    </g>

    <!-- Chart -->
    <rect x="438" y="478" width="414" height="212" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
    <polyline points="470,640 530,600 590,616 650,556 710,584 770,512 820,536" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#a855f7" fill-opacity="0.85">

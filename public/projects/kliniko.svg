      <rect x="200" y="350" width="13" height="10" rx="3" fill-opacity="0.9"/>
      <rect x="226" y="351" width="96" height="9" rx="4.5" fill-opacity="0.85"/>
      <rect x="200" y="398" width="13" height="10" rx="3" fill-opacity="0.28"/>
      <rect x="226" y="399" width="84" height="9" rx="4.5" fill-opacity="0.28"/>
      <rect x="200" y="446" width="13" height="10" rx="3" fill-opacity="0.28"/>
      <rect x="226" y="447" width="104" height="9" rx="4.5" fill-opacity="0.28"/>
